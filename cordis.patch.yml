# dsh-extra-sandbox-presets bundle patch.
#
# One row only. The plugin registers every preset in its own `presets` config
# as a DSH permission preset and widens writes for the sessions that select one
# by wrapping the two live enforcement services in place:
#
#   - the mounted filesystem's containment check gains a retry against the
#     directories the selected preset grants, in every confined mode;
#   - the sandbox provider's `confine` gains the matching `--bind` pairs in the
#     bwrap profile, so confined children agree with the write/edit tools;
#   - a runtime context of its own, placed right after the stock `sandbox:policy`
#     note, names those directories so the model is told about the widening. It is
#     a context of its own because the agent loop re-resolves every context from
#     its registered provider, which discards a rewrite of another subsystem's
#     entry; re-rendering from the live selection is what makes it follow a preset
#     switch. A `danger-full-access` preset contributes nothing, since that mode
#     already confines nothing.
#
# No stock row is disabled, replaced, or reordered. The three `SandboxMode`
# values, the `sandbox/mode` session event, every persisted schema, and the
# `sandbox` / `fs` service instances themselves stay exactly as shipped — which
# is also why a failure to load this plugin degrades to stock behaviour instead
# of leaving the harness without a filesystem or a sandbox.
#
# `presets` is deliberately empty here: the profile supplies the real table, so
# this row only names the plugin and its defaults.

- insert:
    - id: extra-sandbox-presets
      name: "dsh-extra-sandbox-presets"
      config:
        presets: {}
