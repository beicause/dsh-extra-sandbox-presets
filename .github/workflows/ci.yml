name: CI

# This plugin only makes sense where bubblewrap exists: it extends the bwrap
# profile of the local sandbox provider and reports every other backend as
# unsupported. A macOS or Windows job would therefore exercise nothing it
# actually does, so the matrix is Linux only by design rather than by omission.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported runtime and the current one. The package is plain
        # JavaScript, so the spread is kept narrow on purpose only to cover both
        # node --test behaviours (directory vs. file-list handling).
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Install bubblewrap
        # The runner image does not ship bubblewrap, and the provider silently
        # falls back to Landlock without it — which would leave the whole
        # bwrap half of this plugin untested. Installing it is therefore part
        # of the contract with the test suite, not an optional convenience.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          bwrap --version

      - name: Relax the unprivileged user-namespace restriction
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which makes `bwrap` fail at runtime even though it is installed.
        run: |
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl --write kernel.unprivileged_userns_clone=1 || true

      - name: Verify bubblewrap can confine
        # Fail here, loudly, rather than letting the sandbox tests take an
        # untested fallback path.
        run: bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc -- true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        # The DSH packages the tests pin are devDependencies, not a global
        # install: the suites import them directly, and a pinned version keeps
        # the contract tests meaningful instead of tracking whatever `dsh`
        # happens to be on the machine.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # The sources are JavaScript with JSDoc types, checked in place against
        # the declaration module that carries the structural contracts. There is
        # no build step: the package runs from source.
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

  audit:
    name: no silent skips
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl --write kernel.unprivileged_userns_clone=1 || true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Fail when a test skipped
        # Every case pins an interface this plugin depends on, so a skip means
        # the environment could not resolve the DSH packages and the suite is
        # not actually checking anything. A skip is treated as a failure, so a
        # compatibility break cannot reach a release as a quiet green run.
        run: node scripts/require-no-skips.mjs
